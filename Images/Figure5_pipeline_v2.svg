<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1560" viewBox="0 0 2020 1560" font-family="Arial, Helvetica, sans-serif">
<defs><linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="577.0" y1="160" x2="719.0" y2="160"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="961.0" y1="160" x2="1050.5" y2="160"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="1379.5" y1="160" x2="1439.0" y2="160"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="886.5" y1="565" x2="618.0" y2="565"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g5" gradientUnits="userSpaceOnUse" x1="1915" y1="285" x2="1831.4765625" y2="565"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g7" gradientUnits="userSpaceOnUse" x1="1268.5234375" y1="565" x2="1163.5" y2="565"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g8" gradientUnits="userSpaceOnUse" x1="1478" y1="900" x2="1240" y2="569"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g9" gradientUnits="userSpaceOnUse" x1="930" y1="660" x2="651.0" y2="978"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient><linearGradient id="g11" gradientUnits="userSpaceOnUse" x1="333.0" y1="980" x2="178" y2="980"><stop offset="0" stop-color="#3B7DDD" stop-opacity="0.05"/><stop offset="0.55" stop-color="#3B7DDD" stop-opacity="1"/></linearGradient></defs>
<rect width="2020" height="1560" fill="#FFFFFF"/>
<g transform="translate(10,10)">
<path d="M155,0H1640A360,360 0 0 1 2000,360V975A155,155 0 0 1 1845,1130H875V1230A155,155 0 0 1 875,1540H360A360,360 0 0 1 0,1180V770A360,360 0 0 1 360,410H1640A50,50 0 0 0 1640,310H155A155,155 0 0 1 155,0Z" fill="#EEF3FC"/>
<rect x="310" y="720" width="435" height="100" rx="50" fill="#FFFFFF"/><rect x="1425" y="720" width="265" height="100" rx="50" fill="#FFFFFF"/><rect x="310" y="1130" width="800" height="100" rx="50" fill="#FFFFFF"/><rect x="1055" y="770" width="55" height="400" rx="27.5" fill="#FFFFFF"/><path d="M1055,975V1131H900A155,155 0 0 0 1055,975Z" fill="#FFFFFF"/><path d="M1110,975V1131H1265A155,155 0 0 1 1110,975Z" fill="#FFFFFF"/>
<circle cx="155" cy="155" r="96" fill="#FFFFFF"/><text x="155" y="171" text-anchor="middle" font-size="46" font-weight="bold" fill="#3B7DDD">Start</text>
<circle cx="875" cy="1385" r="96" fill="#FFFFFF"/><text x="875" y="1401" text-anchor="middle" font-size="46" font-weight="bold" fill="#3B7DDD">End</text>
<g transform="translate(450,82)"><circle r="62" fill="#FFFFFF" stroke="#3B7DDD" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#3B7DDD" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-20V-6L-24,24H24L8,-6V-20M-12,-20H12"/><path d="M-17,10H17"/><circle cx="2" cy="-30" r="3"/><circle cx="10" cy="-38" r="4"/><circle cx="-4" cy="-40" r="2.5"/></g></g>
<text x="450" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#3B7DDD">1. New Sample</text>
<text x="353.0" y="206" font-size="21.5" fill="#1F1F1F">•</text><text x="379.0" y="206" font-size="21.5" fill="#1F1F1F">Time series of (h, T, RPM)</text>
<text x="353.0" y="234" font-size="21.5" fill="#1F1F1F">•</text><text x="379.0" y="234" font-size="21.5" fill="#1F1F1F">One or more RPM sweeps</text>
<text x="353.0" y="262" font-size="21.5" fill="#1F1F1F">•</text><text x="379.0" y="262" font-size="21.5" fill="#1F1F1F">Unknown rheology</text>
<g transform="translate(840,82)"><circle r="62" fill="#FFFFFF" stroke="#1E9E50" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#1E9E50" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-28,-28V26H30"/><circle cx="-16" cy="14" r="2.6" class="f"/><circle cx="-8" cy="6" r="2.6" class="f"/><circle cx="0" cy="8" r="2.6" class="f"/><circle cx="6" cy="-2" r="2.6" class="f"/><circle cx="14" cy="-6" r="2.6" class="f"/><circle cx="20" cy="-14" r="2.6" class="f"/></g></g>
<text x="840" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E9E50">2. Preprocess</text>
<text x="749.0" y="206" font-size="21.5" fill="#1F1F1F">•</text><text x="775.0" y="206" font-size="21.5" fill="#1F1F1F">Trim post-contact data</text>
<text x="749.0" y="234" font-size="21.5" fill="#1F1F1F">•</text><text x="775.0" y="234" font-size="21.5" fill="#1F1F1F">Re-zero h to its minimum</text>
<text x="749.0" y="262" font-size="21.5" fill="#1F1F1F">•</text><text x="775.0" y="262" font-size="21.5" fill="#1F1F1F">One curve per RPM sweep</text>
<text x="749.0" y="290" font-size="21.5" fill="#1F1F1F">•</text><text x="775.0" y="290" font-size="21.5" fill="#1F1F1F">Compute shear rate γ̇</text>
<g transform="translate(1215,82)"><circle r="62" fill="#FFFFFF" stroke="#EE7B30" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#EE7B30" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,26H30"/><path d="M-28,24C-14,24 -10,-28 0,-28C10,-28 14,24 28,24"/><path d="M0,-26V24" stroke-dasharray="4 4"/></g></g>
<text x="1215" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#EE7B30">3. Build Drag Profile</text>
<text x="1080.5" y="206" font-size="21.5" fill="#1F1F1F">•</text><text x="1106.5" y="206" font-size="21.5" fill="#1F1F1F">Drag D = T<tspan baseline-shift="-18%" font-size="70%">%</tspan>/Ω</text>
<text x="1080.5" y="234" font-size="21.5" fill="#1F1F1F">•</text><text x="1106.5" y="234" font-size="21.5" fill="#1F1F1F">Average replicates per height</text>
<text x="1080.5" y="262" font-size="21.5" fill="#1F1F1F">•</text><text x="1106.5" y="262" font-size="21.5" fill="#1F1F1F">Single D(h) curve per RPM</text>
<g transform="translate(1655,82)"><circle r="62" fill="#FFFFFF" stroke="#A1309B" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#A1309B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-28,-28V26H30"/><path d="M-20,18C-6,18 2,12 8,4L26,-18"/><path d="M14,-18H26V-6"/></g></g>
<text x="1655" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#A1309B">4. Hyperbola Fit (fixed h<tspan baseline-shift="-18%" font-size="70%">c</tspan><tspan baseline-shift="35%" font-size="70%">⋆</tspan>)</text>
<text x="1469.0" y="206" font-size="21.5" fill="#1F1F1F">•</text><text x="1495.0" y="206" font-size="21.5" fill="#1F1F1F">D(h) = A/(h + h<tspan baseline-shift="-18%" font-size="70%">c</tspan>) + B</text>
<text x="1469.0" y="234" font-size="21.5" fill="#1F1F1F">•</text><text x="1495.0" y="234" font-size="21.5" fill="#1F1F1F">Recover A for every RPM sweep</text>
<text x="1469.0" y="262" font-size="21.5" fill="#1F1F1F">•</text><text x="1495.0" y="262" font-size="21.5" fill="#1F1F1F">Reject sweep if R<tspan baseline-shift="35%" font-size="70%">2</tspan> &lt; 0.7</text>
<text x="1469.0" y="290" font-size="21.5" fill="#1F1F1F">•</text><text x="1495.0" y="290" font-size="21.5" fill="#1F1F1F">Use calibrated <tspan font-weight="bold" fill="#A1309B">h<tspan baseline-shift="-18%" font-size="70%">c</tspan><tspan baseline-shift="35%" font-size="70%">⋆</tspan></tspan></text>
<g transform="translate(1550,487)"><circle r="62" fill="#FFFFFF" stroke="#F2B705" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#F2B705" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-26" width="56" height="52" rx="3"/><path d="M-28,-8H28"/><path d="M-14,-26V26"/><rect x="-20" y="-21" width="12" height="8" rx="4"/><rect x="-20" y="14" width="12" height="8" rx="4"/><path d="M0,-26V26"/><rect x="-6" y="-21" width="12" height="8" rx="4"/><rect x="-6" y="-2" width="12" height="8" rx="4"/><path d="M14,-26V26"/><rect x="8" y="-21" width="12" height="8" rx="4"/><rect x="8" y="8" width="12" height="8" rx="4"/></g></g>
<text x="1550" y="575" text-anchor="middle" font-size="30" font-weight="bold" fill="#F2B705">5A. Amplitude → Apparent Viscosity</text>
<text x="1298.5234375" y="611" font-size="21.5" fill="#1F1F1F">•</text><text x="1324.5234375" y="611" font-size="21.5" fill="#1F1F1F">Invert calibration: μ<tspan baseline-shift="-18%" font-size="70%">app</tspan> = (A/k)<tspan baseline-shift="35%" font-size="70%">1/p</tspan></text>
<text x="1298.5234375" y="639" font-size="21.5" fill="#1F1F1F">•</text><text x="1324.5234375" y="639" font-size="21.5" fill="#1F1F1F">One μ<tspan baseline-shift="-18%" font-size="70%">app</tspan> per RPM sweep</text>
<text x="1298.5234375" y="667" font-size="21.5" fill="#1F1F1F">•</text><text x="1324.5234375" y="667" font-size="21.5" fill="#1F1F1F">Use calibrated <tspan font-weight="bold" fill="#F2B705">k</tspan> and <tspan font-weight="bold" fill="#F2B705">p</tspan></text>
<g transform="translate(1025,487)"><circle r="62" fill="#FFFFFF" stroke="#1C96D3" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#1C96D3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-20" width="40" height="40" rx="3"/><rect x="-11" y="-11" width="22" height="22"/><path d="M-12,-20V-30M-12,20V30M-20,-12H-30M20,-12H30"/><path d="M-4,-20V-30M-4,20V30M-20,-4H-30M20,-4H30"/><path d="M4,-20V-30M4,20V30M-20,4H-30M20,4H30"/><path d="M12,-20V-30M12,20V30M-20,12H-30M20,12H30"/></g></g>
<text x="1025" y="575" text-anchor="middle" font-size="30" font-weight="bold" fill="#1C96D3">6. Fit Power Law</text>
<text x="916.5" y="611" font-size="21.5" fill="#1F1F1F">•</text><text x="942.5" y="611" font-size="21.5" fill="#1F1F1F">Single RPM → Newtonian</text>
<text x="916.5" y="639" font-size="21.5" fill="#1F1F1F">•</text><text x="942.5" y="639" font-size="21.5" fill="#1F1F1F">≥ 2 RPMs → fit ln A vs. ln γ̇</text>
<g transform="translate(493,487)"><circle r="62" fill="#FFFFFF" stroke="#1D5C7E" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#1D5C7E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-28,-28V26H30"/><path d="M-18,16L22,-22"/><path d="M8,-22H22V-8"/></g></g>
<text x="493" y="575" text-anchor="middle" font-size="30" font-weight="bold" fill="#1D5C7E">7A. Newtonian</text>
<text x="398.0" y="611" font-size="21.5" fill="#1F1F1F">•</text><text x="424.0" y="611" font-size="21.5" fill="#1F1F1F">Report μ<tspan baseline-shift="-18%" font-size="70%">app</tspan> as viscosity</text>
<text x="398.0" y="639" font-size="21.5" fill="#1F1F1F">•</text><text x="424.0" y="639" font-size="21.5" fill="#1F1F1F">Flow index fixed at n = 1</text>
<text x="398.0" y="667" font-size="21.5" fill="#1F1F1F">•</text><text x="424.0" y="667" font-size="21.5" fill="#1F1F1F">Generate rheology formula</text>
<g transform="translate(492,897)"><circle r="62" fill="#FFFFFF" stroke="#C00000" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#C00000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-28,-30V26H30M18,18L30,26L22,32"/><path d="M-22,-28C-14,2 0,16 26,20"/><path d="M-20,20C0,14 14,0 22,-24M14,-18L22,-26L26,-16"/></g></g>
<text x="492" y="990" text-anchor="middle" font-size="30" font-weight="bold" fill="#C00000">7B. Non-Newtonian</text>
<text x="363.0" y="1026" font-size="21.5" fill="#1F1F1F">•</text><text x="389.0" y="1026" font-size="21.5" fill="#1F1F1F">ln A = ln A<tspan baseline-shift="-18%" font-size="70%">0</tspan> + (n − 1) ln γ̇</text>
<text x="363.0" y="1054" font-size="21.5" fill="#1F1F1F">•</text><text x="389.0" y="1054" font-size="21.5" fill="#1F1F1F">Recover n and consistency K</text>
<text x="363.0" y="1082" font-size="21.5" fill="#1F1F1F">•</text><text x="389.0" y="1082" font-size="21.5" fill="#1F1F1F">μ<tspan baseline-shift="-18%" font-size="70%">app</tspan> as a function of γ̇</text>
<g transform="translate(1555,897)"><circle r="62" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#2E7D32" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M-24,28L10,-8"/><path d="M2,-18L18,-34L34,-18L18,-2Z"/><path d="M-36,32H-10M-30,32L-34,22M-22,32L-22,22M-16,32L-12,24"/></g></g>
<text x="1555" y="990" text-anchor="middle" font-size="30" font-weight="bold" fill="#2E7D32">5B. Torque → Shear Stress</text>
<text x="1369.515625" y="1026" font-size="21.5" fill="#1F1F1F">•</text><text x="1395.515625" y="1026" font-size="21.5" fill="#1F1F1F">Cone-plate conversion</text>
<text x="1369.515625" y="1054" font-size="21.5" fill="#1F1F1F">•</text><text x="1395.515625" y="1054" font-size="21.5" fill="#1F1F1F">τ = c<tspan baseline-shift="-18%" font-size="70%">τ</tspan> T<tspan baseline-shift="-18%" font-size="70%">%</tspan> per RPM sweep</text>
<text x="1369.515625" y="1082" font-size="21.5" fill="#1F1F1F">•</text><text x="1395.515625" y="1082" font-size="21.5" fill="#1F1F1F">Use calibrated <tspan font-weight="bold" fill="#2E7D32">c<tspan baseline-shift="-18%" font-size="70%">τ</tspan></tspan></text>
<g transform="translate(545,1305)"><circle r="62" fill="#FFFFFF" stroke="#3B7DDD" stroke-width="1.6" stroke-dasharray="6 5"/><g fill="none" stroke="#3B7DDD" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle r="7"/><path d="M0.0,-9.0L0.0,-22.0"/><circle cx="0.0" cy="-28.0" r="6"/><path d="M7.8,-4.5L19.1,-11.0"/><circle cx="24.2" cy="-14.0" r="6"/><path d="M7.8,4.5L19.1,11.0"/><circle cx="24.2" cy="14.0" r="6"/><path d="M0.0,9.0L0.0,22.0"/><circle cx="0.0" cy="28.0" r="6"/><path d="M-7.8,4.5L-19.1,11.0"/><circle cx="-24.2" cy="14.0" r="6"/><path d="M-7.8,-4.5L-19.1,-11.0"/><circle cx="-24.2" cy="-14.0" r="6"/></g></g>
<text x="545" y="1395" text-anchor="middle" font-size="30" font-weight="bold" fill="#3B7DDD">8. Classify Rheology Regime</text>
<text x="348.0" y="1431" font-size="21.5" fill="#1F1F1F">•</text><text x="374.0" y="1431" font-size="21.5" fill="#1F1F1F">n &gt; 1.05 → Shear-thickening</text>
<text x="348.0" y="1459" font-size="21.5" fill="#1F1F1F">•</text><text x="374.0" y="1459" font-size="21.5" fill="#1F1F1F">0.95 ≤ n ≤ 1.05 → Newtonian</text>
<text x="348.0" y="1487" font-size="21.5" fill="#1F1F1F">•</text><text x="374.0" y="1487" font-size="21.5" fill="#1F1F1F">n &lt; 0.95 → Shear-thinning</text>
<text x="348.0" y="1515" font-size="21.5" fill="#1F1F1F">•</text><text x="374.0" y="1515" font-size="21.5" fill="#1F1F1F">&lt; 2 valid RPMs → Undetermined</text>
