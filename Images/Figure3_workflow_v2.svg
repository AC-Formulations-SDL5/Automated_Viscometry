<text x="298.0" y="234" font-size="21.5" fill="#1F1F1F">•</text><text x="324.0" y="234" font-size="21.5" fill="#1F1F1F">Viscometer initialization</text>
<text x="298.0" y="262" font-size="21.5" fill="#1F1F1F">•</text><text x="324.0" y="262" font-size="21.5" fill="#1F1F1F">Washing-station initialization</text>
